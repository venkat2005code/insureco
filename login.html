<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - InsurCo</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-body">

    <div class="auth-shell">
        <!-- Top Controls (Logo & Globe) -->
        <div class="auth-header-bar" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
            <div></div> <!-- Left spacer to balance centering -->
            <a href="index.html" class="brand-logo" style="margin: 0;">
                <i class="fas fa-shield-halved"></i> Insur<span>Co</span>
            </a>
            <div style="display: flex; gap: 12px; align-items: center; justify-content: flex-end;">
                <button class="theme-toggle" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
                <button class="language-toggle" aria-label="Switch Language">
                    <i class="fas fa-globe"></i>
                </button>
            </div>
        </div>

        <div class="auth-main">
            <!-- Form Side -->
            <div class="auth-main-column">
                <div class="auth-card">
                    <div class="auth-card-header">
                        <h1 class="h2">Welcome back</h1>
                        <p>Log in to manage your policies, claims and coverage in one secure place.</p>
                    </div>

                    <form action="dashboard-user.html" class="auth-form">
                        <div class="field field--with-icon">
                            <input type="email" id="login-email" required class="field-input" placeholder=" ">
                            <span class="field-icon"><i class="fas fa-envelope"></i></span>
                            <label for="login-email" class="field-label">Email address</label>
                        </div>

                        <div>
                            <div class="auth-inline-row">
                                <label for="login-password" class="auth-inline-label"
                                    style="font-weight: 500;">Password</label>
                                <a href="#" class="auth-inline-link">Forgot password?</a>
                            </div>
                            <div class="field field--with-icon">
                                <input type="password" id="login-password" required
                                    class="field-input field-input-password">
                                <span class="field-icon"><i class="fas fa-lock"></i></span>
                                <span class="field-affix">
                                    <button type="button" class="field-toggle" data-toggle-password="login-password"
                                        aria-label="Toggle password visibility">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </span>
                                <label for="login-password" class="field-label">Password</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary auth-submit">Sign in</button>
                    </form>

                    <div class="auth-divider">or sign in with</div>

                    <div class="social-login-grid">
                        <a href="#" class="btn btn-outline btn-social" title="Sign in with Google">
                            <i class="fab fa-google"></i>
                        </a>
                        <a href="#" class="btn btn-outline btn-social" title="Sign in with LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="#" class="btn btn-outline btn-social" title="Sign in with Apple">
                            <i class="fab fa-apple"></i>
                        </a>
                    </div>

                    <div class="auth-meta text-center">
                        <span class="text-muted">Don't have an account? </span>
                        <a href="signup.html">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>
    <script>
        (function () {
            var toggles = document.querySelectorAll('[data-toggle-password]');
            toggles.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var id = btn.getAttribute('data-toggle-password');
                    var input = document.getElementById(id);
                    if (!input) return;
                    var hidden = input.type === 'password';
                    input.type = hidden ? 'text' : 'password';
                    btn.setAttribute('aria-pressed', String(hidden));
                    var icon = btn.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            });
        })();
    </script>

</body>

</html>
